    <main>
        <section class="hero-section">
            <article class="contact-text">
                <h2>Contactez-moi</h2>
                <div class="contact-info">
                    <p class="contact-item">
                        <i class="fa-brands fa-linkedin"></i> 
                        Visitez mon LinkedIn en cliquant<a class="souligner" href="https://www.linkedin.com/in/tom-pannier-267948253/" target="_blank">ici</a> !

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nav = document.querySelector('nav');
            const hamburger = document.createElement('div');
            hamburger.className = 'hamburger';
            hamburger.innerHTML = '<span></span><span></span><span></span>';
            nav.appendChild(hamburger);
            
            const menu = document.querySelector('nav ul');
            
            hamburger.addEventListener('click', function() {
                menu.classList.toggle('active');
                hamburger.classList.toggle('active');
            });
            
            document.querySelectorAll('nav ul li a').forEach(link => {
                link.addEventListener('click', function() {
                    menu.classList.remove('active');
                    hamburger.classList.remove('active');
                });
            });
            
            document.addEventListener('click', function(event) {
                if (!menu.contains(event.target) && !hamburger.contains(event.target) && menu.classList.contains('active')) {
                    menu.classList.remove('active');
                    hamburger.classList.remove('active');
                }
            });
        });
    </script>
</body>
