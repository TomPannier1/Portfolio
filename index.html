<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Tom Pannier | Cybersécurité</title>
    <meta name="description" content="Portfolio de Tom Pannier, étudiant en cybersécurité à l'ESIEA">
    <link rel="icon" type="image/png" href="assets/img/favicon.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <h1>Tom Pannier</h1>
            </div>            
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="resume.html">Résumé</a></li>                
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero-section">
            <figure class="hero-pic">
                <img src="assets/img/main_photo.jpg" alt="Photo de profil de Tom Pannier">
            </figure>
            <article class="hero-text">
                <h2>Tom Pannier</h2>
                <p>Passionné par la <span class="highlight">cybersécurité</span>, je suis étudiant en 4ᵉ année à l'<span class="highlight">ESIEA</span> et je recherche actuellement un stage pour avril 2026, pour une durée de 4 mois.</p>
                <div class="btn-group">
                    <a href="assets/img/CV.png" class="btn btn-primary" target="_blank" download>
                        <i class="fas fa-download"></i> Télécharger CV
                    </a>
                    <a href="contact.html" class="btn btn-secondary">
                        <i class="fas fa-envelope"></i> Contact
                    </a>
                </div>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Tom Pannier. Tous droits réservés.</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nav = document.querySelector('nav');
            const hamburger = document.createElement('div');
            hamburger.className = 'hamburger';
            hamburger.innerHTML = '<span></span><span></span><span></span>';
            nav.appendChild(hamburger);
            
            const menu = document.querySelector('nav ul');
            
            hamburger.addEventListener('click', function() {
                menu.classList.toggle('active');
                hamburger.classList.toggle('active');
            });
            
            document.querySelectorAll('nav ul li a').forEach(link => {
                link.addEventListener('click', function() {
                    menu.classList.remove('active');
                    hamburger.classList.remove('active');
                });
            });
            
            document.addEventListener('click', function(event) {
                if (!menu.contains(event.target) && !hamburger.contains(event.target) && menu.classList.contains('active')) {
                    menu.classList.remove('active');
                    hamburger.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
